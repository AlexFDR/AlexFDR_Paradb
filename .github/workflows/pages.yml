name: Refresh gallery and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Cache ParaCommsDB details
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/paracommsdb-cache
          key: paracommsdb-${{ hashFiles('scripts/update_data.py') }}-${{ github.run_id }}
          restore-keys: |
            paracommsdb-${{ hashFiles('scripts/update_data.py') }}-
      - name: Cache cover images
        uses: actions/cache@v4
        with:
          path: data/covers
          key: covers-${{ hashFiles('scripts/update_data.py') }}-${{ github.run_id }}
          restore-keys: |
            covers-${{ hashFiles('scripts/update_data.py') }}-
      - name: Install cover optimizer
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Refresh chart data
        env:
          PARACOMMS_CACHE_DIR: ${{ runner.temp }}/paracommsdb-cache
        run: python scripts/update_data.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
